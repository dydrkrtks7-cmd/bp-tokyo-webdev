<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Design System Tags -->
    <meta name="bpaas-design-system" content="brutalist-avantgarde">
    <meta name="bpaas-design-theme" content="kr-night-signal">
    <title>홍대 유흥 추천정보 | Night Transit Map & 데이터 분석</title>
    <!-- Meta Data -->
    <meta name="description" content="홍대 유흥권을 단순한 방문처가 아닌 '데이터와 이동의 흐름'으로 분석한 가이드. 시간대별 에너지 지수, 지역 간 동선 효율성 등 실무적인 정보를 제공합니다.">
    <meta name="keywords" content="홍대 유흥 추천정보, Night Transit Map, 홍대 클럽 정보, 마곡 강서 유흥지도, 밤거리 데이터 분석">
    <!-- Open Graph & Twitter Cards -->
    <meta property="og:title" content="Night Transit Map: 홍대 유흥권 구조 분석">
    <meta property="og:description" content="홍대 유흥권을 단순한 방문처가 아닌 '데이터와 이동의 흐름'으로 분석한 가이드. 시간대별 에너지 지수, 지역 간 동선 효율성 등 실무적인 정보를 제공합니다.">
    <style>
        /* CSS 핵심: 이전 페이지와 동일한 디자인 시스템 재사용 */
        :root {
            --color-bg-primary: #0a0b10;
            --color-bg-secondary: #14161f;
            --color-text-main: #ffffff;
            --color-text-muted: #9ca3af;
            --color-accent-neon: #ccff00; /* Night Signal Yellow */
            --color-accent-blue: #00d1ff;
            --font-family-headings: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            --font-family-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--color-bg-primary);
            color: var(--color-text-main);
            font-family: var(--font-family-body);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Layout & Typography */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 4rem 2rem;
        }

        h1, h2, h3, h4 {
            font-family: var(--font-family-headings);
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            line-height: 1.1;
            margin-bottom: 1.5rem;
            color: var(--color-text-main);
            border-left: 8px solid var(--color-accent-neon);
            padding-left: 1.5rem;
        }

        h2 {
            font-size: clamp(2rem, 4vw, 3rem);
            margin-bottom: 1.5rem;
            color: var(--color-text-main);
        }

        p {
            margin-bottom: 1.5rem;
            font-size: 1.125rem;
            color: #d1d5db;
        }

        /* Navigation */
        header {
            border-bottom: 2px solid var(--color-text-muted);
            background-color: rgba(10, 11, 16, 0.9);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
        }

        .brand-name {
            font-weight: 900;
            font-size: 1.5rem;
            color: var(--color-accent-neon);
            text-decoration: none;
            letter-spacing: -1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--color-text-main);
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: color 0.3s ease, border-bottom 0.3s ease;
        }

        nav a:hover {
            color: var(--color-accent-neon);
            border-bottom: 2px solid var(--color-accent-neon);
        }

        /* Responsive Breakpoints */
        @media (max-width: 768px) {
            .nav-wrapper { flex-direction: column; gap: 1rem; }
            nav ul { gap: 1rem; font-size: 0.8rem; }
            h1 { border-left: 4px solid var(--color-accent-neon); padding-left: 1rem; }
        }

        /* Content Sections */
        .intro-text {
            max-width: 800px;
            margin-bottom: 4rem;
            font-size: 1.25rem;
        }

        .grid-layout-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 3rem;
            margin-top: 3rem;
        }

        @media (max-width: 768px) {
            .grid-layout-2 { grid-template-columns: 1fr; }
        }

        /* Brutalist Card Style */
        .card-brutal {
            background-color: var(--color-bg-secondary);
            border: 3px solid #4b5563;
            padding: 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
        }

        .card-brutal:hover {
            transform: translateY(-5px);
            box-shadow: 8px 8px 0px var(--color-accent-blue);
            border-color: var(--color-text-main);
        }

        .card-title {
            color: var(--color-accent-neon);
            font-size: 1.25rem;
            margin-bottom: 1rem;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Highlight Box */
        .highlight-box {
            border: 3px solid var(--color-accent-neon);
            background-color: rgba(204, 255, 0, 0.05);
            padding: 3rem;
            margin: 4rem 0;
        }

        .highlight-box h3 {
            color: var(--color-accent-neon);
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        /* Data List */
        ul.data-list {
            list-style: none;
        }

        ul.data-list li {
            padding-left: 2rem;
            position: relative;
            margin-bottom: 0.8rem;
            font-size: 1.1rem;
        }

        ul.data-list li::before {
            content: "►";
            color: var(--color-accent-blue);
            position: absolute;
            left: 0;
            top: 2px;
        }

        /* Footer */
        footer {
            margin-top: 5rem;
            padding-bottom: 3rem;
            border-top: 2px solid #4b5563;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }

    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="nav-wrapper">
            <a href="/" class="brand-name">Night Transit Map</a>
            <nav>
                <ul>
                    <li><a href="/">홈</a></li>
                    <li><a href="/region/nowon">노원 유흥정보</a></li>
                    <li><a href="/region/kyunghee">경희대 정보</a></li>
                    <li><a href="/data/maps">지도 데이터</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        
        <!-- Hero Section -->
        <section aria-labelledby="hero-title">
            <h1 id="hero-title">Night Transit Map: 홍대 유흥권 구조 분석</h1>
            <p class="intro-text">
                단순히 '어디가 좋은지'를 나열하는 것을 넘어, 홍대 유흥권을 하나ᅡ의 거대한 이동 시서템 (Transit System) 으로 보고 분석했습니다. 
                시간대별 에너지 지수, 지역 간 동선 효율성, 그리고 실제 현장 경험을 바탕으로 한 데이터 기반의 가이드입니다.
            </p>
</body>
</html>
