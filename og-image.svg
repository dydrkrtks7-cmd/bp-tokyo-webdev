<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e94560"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1107" cy="378" r="21" fill="#16213e" opacity="0.18"/>
    <circle cx="851" cy="656" r="39" fill="#16213e" opacity="0.10"/>
    <circle cx="1221" cy="-40" r="26" fill="#16213e" opacity="0.09"/>
    <circle cx="179" cy="-42" r="34" fill="#16213e" opacity="0.08"/>
    <circle cx="672" cy="366" r="31" fill="#16213e" opacity="0.10"/>
    <circle cx="163" cy="515" r="89" fill="#16213e" opacity="0.19"/>
    <rect x="30" y="558" width="54" height="65" rx="8" fill="#1a1a2e" opacity="0.09" transform="rotate(31, 1087, 111)"/>
    <rect x="340" y="685" width="98" height="82" rx="8" fill="#1a1a2e" opacity="0.12" transform="rotate(6, 39, 540)"/>
    <rect x="370" y="348" width="27" height="53" rx="8" fill="#1a1a2e" opacity="0.06" transform="rotate(34, 440, 687)"/>
    <rect x="1196" y="113" width="56" height="51" rx="8" fill="#1a1a2e" opacity="0.08" transform="rotate(18, 567, -85)"/>
    <rect x="115" y="334" width="30" height="38" rx="8" fill="#1a1a2e" opacity="0.13" transform="rotate(23, 591, 581)"/>
    <rect x="898" y="563" width="52" height="89" rx="8" fill="#1a1a2e" opacity="0.09" transform="rotate(43, 110, 670)"/>
    <rect x="519" y="-7" width="89" height="78" rx="8" fill="#1a1a2e" opacity="0.14" transform="rotate(37, 1123, -87)"/>
    <rect x="-58" y="453" width="21" height="58" rx="8" fill="#1a1a2e" opacity="0.08" transform="rotate(27, 523, 128)"/>
    <polygon points="896,-126 990,62 802,62" fill="#16213e" opacity="0.13"/>
    <polygon points="87,-68 119,-4 55,-4" fill="#16213e" opacity="0.09"/>
    <polygon points="741,76 789,172 693,172" fill="#16213e" opacity="0.08"/>
    <polygon points="1195,635 1215,675 1175,675" fill="#16213e" opacity="0.08"/>

  <!-- Wave at bottom -->
  <path d="M0,540 C360,585 840,495 1200,540 L1200,630 L0,630Z" fill="#16213e" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    홍대 유흥 추천정보
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    홍대 — 유흥
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#e94560" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#e94560" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    홍대 홍대 유흥 추천정보 — 유흥
  </text>
</svg>